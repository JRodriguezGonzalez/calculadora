<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora con JS</title>
    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Enlace a tu hoja de estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="container" id="contenedor-principal">
            <div class="row justify-content-center align-items-center g-2">
                <div class="col">
                    <div class="mb-3">
                        <label for="dato1" class="form-label">Numero 1</label>
                        <input type="number" class="form-control" id="dato1" placeholder="Ingrese su numero">
                    </div>
                </div>
                <div class="col">
                    <div class="mb-3">
                        <label for="dato2" class="form-label">Numero 2</label>
                        <input type="number" class="form-control" id="dato2" placeholder="Ingrese su numero">
                    </div>
                </div>
            </div>
            
            <div class="row justify-content-center align-items-center g-2 botones-operacion">
                <div class="col">
                    <button id="btnSumar" class="btn boton-operacion" onclick="suma()">Sumar +</button>
                </div>
                <div class="col">
                    <button id="btnRestar" class="btn boton-operacion" onclick="resta()">Restar -</button>
                </div>
                <div class="col">
                    <button id="btnDividir" class="btn boton-operacion" onclick="dividir()">Dividir /</button>
                </div>
                <div class="col">
                    <button id="btnMultiplicar" class="btn boton-operacion" onclick="multiplicar()">Multiplicar x</button>
                </div>
            </div>            

            <div class="row mt-4 justify-content-center align-items-center g-2 botones-operacion">
                <div class="col">
                    <button id="btnIgualdad" class="btn boton-operacion" onclick="comparar('igualdad')">Igualdad =</button>
                </div>
                <div class="col">
                    <button id="btnMayor" class="btn boton-operacion" onclick="comparar('mayor')"></button>
                </div>
                <div class="col">
                    <button id="btnMenor" class="btn boton-operacion" onclick="comparar('menor')">Menor que <</button>
                </div>
            </div>            
            
            <div class="row justify-content-center align-items-center g-2">
                <div class="col-md-12 mt-4">
                    <textarea readonly class="form-control resultado-textarea" id="resultado" rows="5"></textarea>
                </div>
                <div class="col-md-12 mt-4 texto-centrado">
                    <button id="btnLimpiar" class="btn boton-limpiar" onclick="limpiar()">Limpiar</button>
                </div>
            </div>            
            
        </div>        
    </main>
    
    <script>
        function suma() {
            let a = document.getElementById("dato1").value.trim();
            let b = document.getElementById("dato2").value.trim();
    
            // Verificar si los campos están vacíos
            if (a === "" || b === "") {
                document.getElementById("resultado").value = "Por favor, complete ambos campos";
            } else if (isNaN(a) || isNaN(b)) {
                // Verificar si los valores no son números
                document.getElementById("resultado").value = "Por favor, ingrese números válidos";
            } else {
                // Si ambos son números, realizar la suma
                let resultado = parseInt(a) + parseInt(b);
                document.getElementById("resultado").value = resultado;
            }
        }

        function resta() {
            let a = document.getElementById("dato1").value.trim();
            let b = document.getElementById("dato2").value.trim();
    
            // Verificar si los campos están vacíos
            if (a === "" || b === "") {
                document.getElementById("resultado").value = "Por favor, complete ambos campos";
            } else if (isNaN(a) || isNaN(b)) {
                // Verificar si los valores no son números
                document.getElementById("resultado").value = "Por favor, ingrese números válidos";
            } else {
                // Si ambos son números, realizar la suma
                let resultado = parseInt(a) - parseInt(b);
                document.getElementById("resultado").value = resultado;
            }
        }

        function dividir() {
            let a = document.getElementById("dato1").value.trim();
            let b = document.getElementById("dato2").value.trim();

            // Verificar si los campos están vacíos
            if (a === "" || b === "") {
                document.getElementById("resultado").value = "Por favor, complete ambos campos";
            } else if (isNaN(a) || isNaN(b)) {
                // Verificar si los valores no son números
                document.getElementById("resultado").value = "Por favor, ingrese números válidos";
            } else {
                // Si ambos son números, intentar realizar la división
                try {
                    let resultado = parseInt(a) / parseInt(b);

                    // Verificar si el divisor es cero
                    if (!isFinite(resultado)) {
                        throw new Error("No se puede dividir entre cero");
                    }

                    document.getElementById("resultado").value = resultado;
                } catch (error) {
                    // Capturar y manejar la excepción
                    document.getElementById("resultado").value = error.message;
                }
            }
        }

        function multiplicar() {
            let a = document.getElementById("dato1").value.trim();
            let b = document.getElementById("dato2").value.trim();
    
            // Verificar si los campos están vacíos
            if (a === "" || b === "") {
                document.getElementById("resultado").value = "Por favor, complete ambos campos";
            } else if (isNaN(a) || isNaN(b)) {
                // Verificar si los valores no son números
                document.getElementById("resultado").value = "Por favor, ingrese números válidos";
            } else {
                // Si ambos son números, realizar la suma
                let resultado = parseInt(a) * parseInt(b);
                document.getElementById("resultado").value = resultado;
            }
        }

        function comparar(tipo) {
            let a = document.getElementById("dato1").value.trim();
            let b = document.getElementById("dato2").value.trim();

            // Verificar si los campos están vacíos
            if (a === "" || b === "") {
                document.getElementById("resultado").value = "Por favor, complete ambos campos";
                return; // Salir de la función si hay campos vacíos
            }

            // Verificar si los valores no son números
            if (isNaN(a) || isNaN(b)) {
                document.getElementById("resultado").value = "Por favor, ingrese números válidos";
                return; // Salir de la función si los valores no son números
            }

            // Convertir los valores a números flotantes
            a = parseFloat(a);
            b = parseFloat(b);

            switch (tipo) {
                case 'igualdad':
                    if (a === b) {
                        document.getElementById("resultado").value = "Los números son iguales";
                    } else {
                        document.getElementById("resultado").value = "Los números no son iguales";
                    }
                    break;
                case 'mayor':
                    if (a > b) {
                        document.getElementById("resultado").value = "El primer número es mayor que el segundo";
                    } else {
                        document.getElementById("resultado").value = "El primer número no es mayor que el segundo";
                    }
                    break;
                case 'menor':
                    if (a < b) {
                        document.getElementById("resultado").value = "El primer número es menor que el segundo";
                    } else {
                        document.getElementById("resultado").value = "El primer número no es menor que el segundo";
                    }
                    break;
                default:
                    document.getElementById("resultado").value = "Por favor, seleccione una comparación válida";
            }
        }


        function limpiar() {
            // Limpiar los campos de entrada
            document.getElementById("dato1").value = "";
            document.getElementById("dato2").value = "";

            // Limpiar el área de resultado
            document.getElementById("resultado").value = "";
        }

    </script>
      
    
    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
